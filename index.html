<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualización Sísmica - TFG Daniel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link rel="icon" type="image/png" href="/favicon.ico" />
    <script type="module" crossorigin src="/tfg-visualizacion-sismica/assets/main-Cf0dqJ4L.js"></script>
    <link rel="modulepreload" crossorigin href="/tfg-visualizacion-sismica/assets/fdsnQueries-DnkoU3bc.js">
    <link rel="stylesheet" crossorigin href="/tfg-visualizacion-sismica/assets/main-BMBktQjG.css">
  </head>

  <body>
    <nav class="topnav">
      <span class="topnav__brand">SEISVIEW</span>

      <nav class="topnav__nav">
        <button class="topnav__nav-btn" id="nav-to-station">Estación</button>
        <button class="topnav__nav-btn topnav__nav-btn--active" id="nav-to-map">Mapa</button>
      </nav>

      <div class="topnav__right">
        <span class="topnav__mode topnav__mode--map">MAPA</span>
        <span class="topnav__clock" id="utc-clock">--:--:-- UTC</span>
      </div>
    </nav>

    <div id="mapContainer">
      <sp-station-quake-map
        centerLat="37"
        centerLon="-4"
        zoomLevel="5"
        fitBounds="false"
        tileUrl="https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}"
        tileAttribution="Tiles &copy; Esri"
        maxZoom="12"
      >
      </sp-station-quake-map>
    
      <!-- Panel de información del terremoto -->
      <div id="quakeInfoPanel" class="hidden">
        <div class="quake-magnitude" id="quakeMagnitude">
          <!-- Magnitud -->
        </div>
        <div class="quake-details" id="quakeDetails">
          <!-- Líneas de información -->
        </div>
      </div>
    </div>

    <div id="stationInfoPanel">

      <!-- Columna 1 (18%) -->
      <div id="stationColumn" class="panel-column station-column">
        <div id="stationName" class="station-name"></div>
        <div id="stationDetails" class="station-details"></div>
        <div class="station-actions">
          <button id="btnOpenStationView" class="btn-download hidden">
            Abrir vista de estación
          </button>
        </div>
        <div class="download-container">
          <button id="btnDownloadMSeed" class="hidden btn-download">
            Descargar MiniSEED (.mseed)
          </button>
        </div>
      </div>
    
      <!-- Columna 2 (70%) -->
      <div id="seismogramColumn" class="panel-column seismo-column">
        <div id="seismogramContainer">
          <!-- Aquí se insertará el sismograma -->
        </div>
      </div>
      
      <!-- Columna 3 (12%) -->
      <div id="stationListColumn" class="panel-column station-list-column">

        <div class="station-list-title">
          Selected Stations
        </div>

        <div id="selectedStationsList">
          <!-- Aquí aparecerán las estaciones -->
        </div>

      </div>

    
    </div>
    

  </body>
</html>
